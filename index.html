<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Homenagem Especial</title>

    <link rel="stylesheet" href="style.css?v=4">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

</head>

<body>

    <div class="container">

        <div class="card">

            <div class="heart">
                ❤️
            </div>

            <h1>Obrigado!</h1>

            <h2 id="nome"></h2>

            <p id="mensagem">
                Esta homenagem foi preparada com muito carinho.
            </p>

            <div class="loading">

                <div class="spinner"></div>

                <p>Carregando seu certificado...</p>

            </div>

            <img
                id="certificado"
                src=""
                alt="Certificado"
            >

            <a
                id="download"
                href=""
                download
            >
                <button type="button">
                    ⬇️ Baixar Certificado
                </button>
            </a>

        </div>

    </div>

    <script src="script.js?v=5"></script>

</body>

</html>
